<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Машка-Алкашка 🥂</title>
  <style>
    :root {
      --pink: #ff4d8d;
      --deep: #1a1a2e;
      --bg: #fff0f6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(255, 77, 141, 0.15);
      max-width: 560px;
      width: 100%;
      padding: 48px 40px;
      text-align: center;
    }
    .emoji { font-size: 72px; line-height: 1; margin-bottom: 16px; }
    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    h1 span { color: var(--pink); }
    p.subtitle {
      font-size: 16px;
      color: #777;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .badge {
      display: inline-block;
      background: var(--pink);
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🥂</div>
    <h1>Привет! Это <span>Машка-Алкашка</span></h1>
    <p class="subtitle">
      Мини-сайтик моей сестры. Скоро здесь появится что-то классное —
      а пока держи бокал и хорошее настроение! ✨
    </p>
    <span class="badge">Сайт в разработке</span>
    <div class="footer">Сделано с любовью 💗</div>
  </div>
</body>
</html>
