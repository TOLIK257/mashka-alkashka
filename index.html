<style>
/* ── tokens ─────────────────────────────────────────────────── */
:root{
  --bg:#f9f5f0;--bg2:#f3ede5;--text:#1e1916;--muted:#7a6e68;
  --card:#fff;--line:rgba(30,25,22,.08);
  --a1:#c94f2e;--a2:#e8935a;
  --sh:0 2px 4px rgba(30,25,22,.04),0 14px 36px rgba(30,25,22,.08);
  --r:22px;--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",-apple-system,sans-serif;
}
/* palettes */
:root[data-p=ocean]{--bg:#f2f7fc;--bg2:#e8f0f8;--a1:#1d5fc4;--a2:#3bbdd4}
:root[data-p=forest]{--bg:#f3f8f0;--bg2:#e6f0e1;--a1:#256e44;--a2:#74b83e}
:root[data-p=violet]{--bg:#f7f3fc;--bg2:#ede5f7;--a1:#6d3bc9;--a2:#d152a8}
:root[data-p=mono]{--bg:#f5f5f3;--bg2:#eaeae8;--a1:#1a1a1a;--a2:#666}
:root[data-p=sakura]{--bg:#fef5f7;--bg2:#fce8ed;--a1:#c9355a;--a2:#e87aa0}
:root[data-dark]{--bg:#141210!important;--bg2:#1c1916!important;--text:#f0e8e2;--muted:#9a8e88;
  --card:#201c19;--line:rgba(240,232,226,.1);--sh:0 2px 4px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.4)}
:root[data-dark][data-p=mono]{--a1:#ddd;--a2:#aaa}
:root[data-f=sans]{--serif:var(--sans)}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
::selection{background:var(--a1);color:#fff}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:var(--sans)}

/* ── nav pill ────────────────────────────────────────────────── */
.nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;
  width:min(680px,calc(100% - 20px));
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 6px 6px 18px;border-radius:999px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--line);box-shadow:var(--sh);
}
.nav-logo{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.nav-links{display:flex;gap:2px;overflow:hidden}
.nav-links a{
  font-size:13.5px;font-weight:500;color:var(--muted);
  padding:7px 14px;border-radius:999px;transition:all .2s;white-space:nowrap;
}
.nav-links a:hover{color:var(--text);background:var(--line)}
.nav-links a.on{background:var(--a1);color:#fff}
:root[data-p=mono][data-dark] .nav-links a.on{color:#111}

/* ── views ───────────────────────────────────────────────────── */
.view{display:none;max-width:980px;margin:0 auto;padding:0 22px;width:100%}
.view.on{display:block;animation:rise .5s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}

/* ── hero ────────────────────────────────────────────────────── */
.hero{position:relative;padding:152px 0 56px;text-align:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.bl1{width:360px;height:360px;background:var(--a2);top:30px;left:-80px;opacity:.38;animation:drift 15s ease-in-out infinite}
.bl2{width:300px;height:300px;background:var(--a1);top:140px;right:-60px;opacity:.25;animation:drift 20s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(28px,20px) scale(1.07)}}
.hero>*:not(.blob){position:relative;z-index:1}
.eyebrow-pill{
  display:inline-block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--a1);padding:5px 14px;border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);
  border-radius:999px;margin-bottom:22px;
}
.eyebrow-pill:empty{display:none}
.hero-name{
  font-family:var(--serif);font-weight:700;letter-spacing:-.03em;line-height:1;
  font-size:clamp(48px,11vw,112px);margin-bottom:18px;
}
.hero-name .nm{
  font-style:italic;
  background:linear-gradient(118deg,var(--a1),var(--a2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.hero-sub{font-size:clamp(16px,2.2vw,20px);color:var(--muted);max-width:540px;margin:0 auto}
.hero-sub:empty{display:none}

/* cta + contacts on home */
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.pill-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 24px;border-radius:999px;font-weight:600;font-size:15px;
  border:1px solid var(--line);cursor:pointer;transition:transform .18s,filter .2s;background:var(--card);
}
.pill-btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.pill-btn.primary{background:var(--a1);color:#fff;border-color:transparent;
  box-shadow:0 8px 20px color-mix(in srgb,var(--a1) 32%,transparent)}
:root[data-p=mono][data-dark] .pill-btn.primary{color:#111}
.strip-3{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  margin:44px auto 0;max-width:680px;
}
.strip-3 a{aspect-ratio:1;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.strip-3 img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.strip-3 a:hover img{transform:scale(1.06)}
@media(max-width:500px){.strip-3{grid-template-columns:repeat(2,1fr);max-width:340px}}

/* ── contact page ────────────────────────────────────────────── */
.contact-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;margin-top:6px;
}
.contact-card{
  display:flex;align-items:center;gap:16px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;box-shadow:var(--sh);
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.contact-card:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(30,25,22,.14);border-color:color-mix(in srgb,var(--a1) 40%,transparent)}
.c-icon{
  width:46px;height:46px;flex-shrink:0;border-radius:14px;
  display:grid;place-items:center;
  background:color-mix(in srgb,var(--a1) 12%,var(--bg2));
  color:var(--a1);
}
.c-icon svg,.c-icon img{width:22px;height:22px;object-fit:contain}
.c-custom-img{width:22px;height:22px;object-fit:contain;border-radius:4px}
.c-text{min-width:0}
.c-label{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-value{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

/* home contacts (mini-row) */
.home-contacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.home-contacts a{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 15px;border-radius:999px;font-size:14px;font-weight:500;
  background:var(--card);border:1px solid var(--line);transition:all .2s;
}
.home-contacts a:hover{border-color:var(--a1);color:var(--a1)}
.home-contacts a svg,.home-contacts a img{width:16px;height:16px;flex-shrink:0}

/* ── inner page layout ───────────────────────────────────────── */
.page{padding:122px 0 64px}
.page-h{
  font-family:var(--serif);font-weight:700;font-size:clamp(34px,7vw,62px);
  letter-spacing:-.03em;line-height:1.04;margin-bottom:32px;
}

/* about */
.about-wrap{display:grid;gap:28px;grid-template-columns:1fr;align-items:start}
.about-wrap.has-photo{grid-template-columns:minmax(0,280px) 1fr}
@media(max-width:680px){.about-wrap.has-photo{grid-template-columns:1fr}}
.about-photo{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);box-shadow:var(--sh)}
@media(max-width:680px){.about-photo{max-width:280px;aspect-ratio:1}}
.about-text{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:clamp(22px,4vw,40px);box-shadow:var(--sh);
  font-size:clamp(16px,2vw,18px);line-height:1.8;white-space:pre-wrap;word-break:break-word;
}
.facts-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.fact-chip{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;
  font-size:14px;
}
.fact-chip small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.fact-chip b{font-weight:600}

/* gallery */
.gallery{columns:3 240px;column-gap:14px}
.gi{
  break-inside:avoid;margin-bottom:14px;
  position:relative;overflow:hidden;border-radius:18px;
  background:var(--bg2);box-shadow:var(--sh);
  cursor:zoom-in;transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.gi img{width:100%;height:auto;display:block;transition:transform .5s}
.gi:hover{transform:translateY(-3px)}
.gi:hover img{transform:scale(1.03)}
.gi:focus-visible{outline:3px solid var(--a1);outline-offset:3px}
.gi-cap{
  position:absolute;inset:auto 0 0;padding:36px 14px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.6));
  color:#fff;font-size:13px;line-height:1.4;
  opacity:0;transition:opacity .25s;
}
.gi-cap:empty{display:none}
.gi:hover .gi-cap{opacity:1}
@media(hover:none){.gi-cap{opacity:1}}
.empty-state{text-align:center;color:var(--muted);padding:80px 0;font-size:16px;column-span:all}

/* lightbox */
.lbox{position:fixed;inset:0;z-index:300;background:rgba(10,8,7,.95);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 16px 24px;gap:12px}
.lbox.on{display:flex;animation:rise .22s}
.lbox img{max-width:100%;max-height:calc(100vh - 100px);border-radius:12px;object-fit:contain}
.lbox-cap{color:#e0d8d2;font-size:14px;text-align:center}
.lbtn{
  position:absolute;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.13);color:#fff;font-size:20px;line-height:44px;text-align:center;
  transition:background .2s;
}
.lbtn:hover{background:rgba(255,255,255,.26)}
#lbClose{top:14px;right:14px}#lbPrev{left:12px;top:50%;margin-top:-22px}#lbNext{right:12px;top:50%;margin-top:-22px}

footer{text-align:center;padding:48px 22px 40px;color:var(--muted);font-size:13px;
  border-top:1px solid var(--line);margin-top:10px}
</style>
</head>

}
function contactHref(c){
  const v=(c.value||"").trim();if(!v)return"";
  if(c.type==="custom")return c.customUrl||"";
  const h=v.replace(/^@/,"");
  const m={telegram:/^https?:/i.test(v)?v:"https://t.me/"+h,instagram:/^https?:/i.test(v)?v:"https://instagram.com/"+h,vk:/^https?:/i.test(v)?v:"https://vk.com/"+h,youtube:/^https?:/i.test(v)?v:"https://youtube.com/@"+h,tiktok:/^https?:/i.test(v)?v:"https://tiktok.com/@"+h,onlyfans:/^https?:/i.test(v)?v:"https://onlyfans.com/"+h,pornhub:/^https?:/i.test(v)?v:"https://www.pornhub.com/model/"+h,email:"mailto:"+v,phone:"tel:"+v.replace(/[^\d+]/g,""),link:/^https?:/i.test(v)?v:(/^[\w.-]+\.[a-z]{2,}/i.test(v)?"https://"+v:"")};
  return m[c.type]||"";
}

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const $=id=>document.getElementById(id);
let D={},photos=[],cur=0;

function applyTheme(t){
  const r=document.documentElement;
  r.dataset.p=t.palette||"coral";
  r.dataset.f=t.font||"serif";
  const dark=t.mode==="dark"||(t.mode!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);
  dark?r.setAttribute("data-dark",""):r.removeAttribute("data-dark");
}

function render(data){
  D=data||{};
  const s=D.site||{},a=D.about||{},g=D.gallery||[],t=D.theme||{},sec=D.sections||{},ctcs=D.contacts||[];
  const name=s.name||"Маша";
  applyTheme(t);
  document.title=(D.seo&&D.seo.title)||(name+" — портфолио");
  $("metaDesc").content=(D.seo&&D.seo.description)||s.subtitle||"";

  // nav
  $("navLogo").textContent=name;
  const tabs=[["#/","Главная"]];
  const secOrder=D.navOrder||["about","gallery","contacts"];
  const secDef={about:{label:D.about&&D.about.title||"Обо мне",show:sec.about!==false},gallery:{label:D.galleryTitle||"Галерея",show:sec.gallery!==false},contacts:{label:D.contactTitle||"Контакты",show:sec.contacts!==false&&ctcs.length>0}};
  secOrder.forEach(k=>{if(secDef[k]&&secDef[k].show)tabs.push(["#/"+k,secDef[k].label])});
  $("navLinks").innerHTML=tabs.map(l=>'<a href="'+l[0]+'">'+esc(l[1])+"</a>").join("");

  // hero
  $("eyebrow").textContent=s.eyebrow!=null?s.eyebrow:"Портфолио";
  const greet=s.greeting!=null?s.greeting:"Привет, я";
  $("heroName").innerHTML=(greet?esc(greet)+" ":"")+'<span class="nm">'+esc(name)+"</span>";
  $("heroSub").textContent=s.subtitle||"";
  const hasGal=sec.gallery!==false&&g.length>0,hasAbout=sec.about!==false,hasContacts=sec.contacts!==false&&ctcs.length>0;
  $("cta").innerHTML=(hasGal?'<a class="pill-btn primary" href="#/gallery">Смотреть работы</a>':"")+(hasAbout?'<a class="pill-btn" href="#/about">Обо мне</a>':"")+(hasContacts&&!hasGal&&!hasAbout?'<a class="pill-btn primary" href="#/contacts">Контакты</a>':"");
  $("homeContacts").innerHTML=ctcs.slice(0,5).map(c=>{const h=contactHref(c);if(!h)return"";return'<a href="'+esc(h)+'" target="_blank" rel="noopener">'+iconHtml(c)+" "+esc(c.label||c.value)+"</a>";}).join("");
  $("strip").innerHTML=hasGal?g.slice(0,3).map(p=>'<a href="#/gallery"><img src="'+esc(p.url)+'" alt="" loading="lazy"></a>').join(""):"";

  // about
  $("aboutTitle").textContent=a.title||"Обо мне";
  const txt=a.text!=null?a.text:s.about;
  const facts=(a.facts||[]).filter(f=>f.label||f.value);
  $("aboutBox").className="about-wrap"+(a.photo?" has-photo":"");
  $("aboutBox").innerHTML=(a.photo?'<img class="about-photo" src="'+esc(a.photo)+'" alt="">':"")+"<div>"+'<div class="about-text">'+esc(txt||"Здесь пока пусто. Добавь текст через админку!")+"</div>"+(facts.length?'<div class="facts-row">'+facts.map(f=>'<div class="fact-chip"><small>'+esc(f.label)+"</small><b>"+esc(f.value)+"</b></div>").join("")+"</div>":"")+"</div>";

  // gallery
  $("galTitle").textContent=D.galleryTitle||"Галерея";
  photos=g;
  $("galGrid").innerHTML=g.length?g.map((p,i)=>'<div class="gi" tabindex="0" role="button" data-i="'+i+'"><img src="'+esc(p.url)+'" alt="'+esc(p.caption||"")+'" loading="lazy"><div class="gi-cap">'+esc(p.caption||"")+"</div></div>").join(""):'<div class="empty-state">Фотографий пока нет 🌸</div>';
  document.querySelectorAll(".gi").forEach(el=>{const open=()=>openLb(+el.dataset.i);el.onclick=open;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}};});

  // contacts page
  $("contactTitle").textContent=D.contactTitle||"Контакты";
  $("contactGrid").innerHTML=ctcs.length?ctcs.map(c=>{const h=contactHref(c);if(!h)return"";return'<a class="contact-card" href="'+esc(h)+'" target="_blank" rel="noopener"><div class="c-icon">'+iconHtml(c)+'</div><div class="c-text"><div class="c-label">'+esc(c.label||c.type)+'</div><div class="c-value">'+esc(c.value||c.customUrl||"")+"</div></div></a>";}).join(""):'<div class="empty-state">Контактов пока нет</div>';

  $("siteFooter").textContent=(s.footer||"Сделано с любовью")+" · "+new Date().getFullYear();
  route();
}

// router
const VALID=["home","about","gallery","contacts"];
function route(){
  const h=location.hash.replace(/^#\/?/,"")||"home";
  const sec=D.sections||{},ctcs=D.contacts||[];
  let r=VALID.includes(h)?h:"home";
  if(r==="about"&&sec.about===false)r="home";
  if(r==="gallery"&&sec.gallery===false)r="home";
  if(r==="contacts"&&(sec.contacts===false||!ctcs.length))r="home";
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+r));
  document.querySelectorAll("#navLinks a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")===(r==="home"?"#/":"#/"+r)));
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);

// lightbox
const lb=$("lbox");
function showLb(){const p=photos[cur];if(!p)return;$("lbImg").src=p.url;$("lbCap").textContent=p.caption||"";const m=photos.length>1;$("lbPrev").style.display=m?"":"none";$("lbNext").style.display=m?"":"none";}
function openLb(i){cur=i;showLb();lb.classList.add("on");document.body.style.overflow="hidden";}
function closeLb(){lb.classList.remove("on");document.body.style.overflow="";}
const stepLb=d=>{cur=(cur+d+photos.length)%photos.length;showLb();};
$("lbClose").onclick=closeLb;
$("lbPrev").onclick=e=>{e.stopPropagation();stepLb(-1);};
$("lbNext").onclick=e=>{e.stopPropagation();stepLb(1);};
lb.onclick=e=>{if(e.target===lb)closeLb();};
addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")stepLb(-1);if(e.key==="ArrowRight")stepLb(1);});

if(PREVIEW){
  addEventListener("message",e=>{if(e.data&&e.data.type==="preview")render(e.data.data);});
  parent.postMessage({type:"preview-ready"},"*");
}else{
  fetch(CONTENT_URL+"?t="+Date.now(),{cache:"no-store"})
    .then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(render)
    .catch(()=>render({}));
}
</script>
</body>
</html>
